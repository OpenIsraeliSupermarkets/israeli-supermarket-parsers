name: Notify daily-publish deps on release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      release_tag:
        description: GitHub release tag (for example v1.0.7)
        required: true
        type: string
      release_url:
        description: GitHub release HTML URL
        required: true
        type: string

permissions:
  contents: read

jobs:
  open-daily-publish-deps-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
      - name: Create daily-publish dependency issue
        env:
          GH_TOKEN: ${{ secrets.DAILY_PUBLISH_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          RELEASE_URL: ${{ inputs.release_url || github.event.release.html_url }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "DAILY_PUBLISH_DISPATCH_TOKEN is required to open an issue on daily-publish."
            exit 1
          fi
          export PACKAGE_NAME="il-supermarket-parser"
          export PACKAGE_VERSION="${RELEASE_TAG#v}"
          chmod +x .github/scripts/create_daily_publish_deps_issue.sh
          .github/scripts/create_daily_publish_deps_issue.sh
